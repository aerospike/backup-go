name: Feature request
description: Suggest a capability the library does not have.
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do, and what stops you from doing it with the current API?
        Describe the situation rather than the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What the API would look like. A sketch of the calls you would want to write is more
        useful than a prose description.
      render: go
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you tried, and why they are not enough.
    validations:
      required: false

  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: This would change the behaviour or signature of an existing exported name.
          required: false
