# Fails if interfaces were changed but mocks were not regenerated.
# Run "make mocks-generate" locally and commit the changes.
name: Mocks up to date

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mocks-check:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get go version from go.mod
        run: |
          echo "GO_VERSION=$(grep '^go ' go.mod | cut -d " " -f 2)" >> $GITHUB_ENV

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate mocks
        run: make mocks-generate

      - name: Check mocks are up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated mocks differ from committed files. You changed an interface but did not run 'make mocks-generate'. Run it locally and commit the changes."
            exit 1
          fi
