name: Tests
on:
  push:
    branches:
      - '**'
  workflow_call:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  # Hermetic: no Aerospike, no object storage, no Docker.
  unit:
    name: Unit tests (race)
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests with the race detector
        run: make test-race

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      # Aerospike service container
      aerospike:
        image: aerospike/aerospike-server-enterprise:8.0.0.7
        ports:
          - 3000:3000
          - 3001:3001
          - 3002:3002

      # Fake GCS server
      fake-gcs-server:
        image: fsouza/fake-gcs-server:1.52.2
        ports:
          - 4443:4443
        options: >-
          --entrypoint sh
          fsouza/fake-gcs-server:1.52.2
          -c "/bin/fake-gcs-server -data /data -scheme http -public-host 127.0.0.1:4443"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Azurite
        run: |
          docker run -d \
            -p 10000:10000 \
            --name azurite \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck \
          && until curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:10000/devstoreaccount1 | grep -qE "400|403"; do \
              echo "Waiting for Azurite..."; sleep 1; \
            done

      - name: Set up Minio
        run: |
          docker run -d \
          -p 9000:9000 \
          --name minio \
          -e "MINIO_ROOT_USER=minioadmin" \
          -e "MINIO_ROOT_PASSWORD=minioadminpassword" \
          -e "MINIO_ACCESS_KEY=minioadmin" \
          -e "MINIO_SECRET_KEY=minioadminpassword" \
          -e "MINIO_BROWSER=off" \
          minio/minio:RELEASE.2025-09-07T16-13-09Z server /data \
          && until (curl -I http://127.0.0.1:9000/minio/health/live | grep "OK"); do echo "Waiting for MinIO server to be ready..."; sleep 3; done \
          && docker exec minio sh -c "mc alias set myminio http://127.0.0.1:9000 minioadmin minioadminpassword && mc mb myminio/backup && mc mb myminio/asbackup \
          && mc anonymous set upload myminio/backup && mc anonymous set download myminio/backup && mc anonymous set public myminio/backup \
          && mc anonymous set upload myminio/asbackup && mc anonymous set download myminio/asbackup && mc anonymous set public myminio/asbackup"

      - name: Test with coverage
        run: |
          make coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: coverage.cov
          verbose: false

  # Gate: a PR that leaves go.mod / go.sum untidy fails.
  tidy:
    name: go mod tidy is clean
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go mod tidy
        run: make tidy

      - name: Fail if go.mod or go.sum changed
        run: |
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod / go.sum are not tidy. Run 'make tidy' and commit the result."
            exit 1
          fi

  examples:
    name: Examples compile
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build examples
        run: make build-examples
