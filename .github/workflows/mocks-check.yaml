# Fails if interfaces were changed but mocks were not regenerated.
# Run "make mocks-generate" locally and commit the changes.
name: Mocks up to date

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  mocks-check:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate mocks
        run: make mocks-generate

      - name: Check mocks are up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated mocks differ from committed files. You changed an interface but did not run 'make mocks-generate'. Run it locally and commit the changes."
            exit 1
          fi
